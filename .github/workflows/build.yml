name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ClipGuard Media Player
        id: build
        run: .\build\build.ps1
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ClipGuard Media Player Setup
          path: _bin/setup/*.exe
          compression-level: 0

      - name: Release (a new version on main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version that has no release yet is published, tagged v<version> on this commit:
          # 0.x as a beta (pre-release), 1.0 and later as a release. A version already
          # released is left as it is.
          $v = '${{ steps.build.outputs.version }}'
          $tag = "v$v"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag is already released"; exit 0 }
          $exe = Get-ChildItem _bin/setup/*.exe | Select-Object -First 1
          if ($v.StartsWith('0.')) {
            gh release create $tag $exe.FullName --target '${{ github.sha }}' --prerelease --title "ClipGuard Media Player $v (beta)" --notes-file RELEASE-NOTES.md
          } else {
            gh release create $tag $exe.FullName --target '${{ github.sha }}' --latest --title "ClipGuard Media Player $v" --notes-file RELEASE-NOTES.md
          }
          if ($LASTEXITCODE) { throw 'release failed' }
